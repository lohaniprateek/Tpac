##### BASIC SETTINGS #####
set -g mouse on
set -g status-position top

##### PANE NAVIGATION #####
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

##### WINDOW LIST FORMATS #####
# Inactive windows
set -g window-status-format "#[fg=colour250,bg=colour235] #I:#W#F #[default]"

##### ACTIVE WINDOW — COLOR PER INDEX #####
set -g window-status-current-format "#[\
bg=#{?#{==:#{window_index},0},green,\
#{?#{==:#{window_index},1},blue,\
#{?#{==:#{window_index},2},yellow,\
#{?#{==:#{window_index},3},magenta,\
#{?#{==:#{window_index},4},cyan,\
#{?#{==:#{window_index},5},red,\
#{?#{==:#{window_index},6},colour33,\
#{?#{==:#{window_index},7},colour129,colour208}}}}}}}}\
,fg=#{?#{==:#{window_index},0},black,\
#{?#{==:#{window_index},1},white,\
#{?#{==:#{window_index},2},black,\
#{?#{==:#{window_index},3},black,\
#{?#{==:#{window_index},4},black,\
#{?#{==:#{window_index},5},white,\
#{?#{==:#{window_index},6},white,\
#{?#{==:#{window_index},7},white,black}}}}}}}}\
,bold] #I:#W#F #[default]"

##### QUICK RELOAD #####
bind r source-file ~/.tmux.conf \; display "tmux reloaded!"
