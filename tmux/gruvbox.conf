# Gruvbox tmux theme
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"

set -g mode-style "bg=#504945,fg=#ebdbb2"
set -g clock-mode-colour "#fabd2f"

setw -g window-status-style "fg=#a89984,bg=#282828"
setw -g window-status-current-style "fg=#1d2021,bg=#b8bb26,bold"
setw -g window-status-activity-style "fg=#1d2021,bg=#fe8019,bold"

set -g status-left-length 80
set -g status-right-length 120
set -g status-left "#[fg=#1d2021,bg=#d79921,bold] #S #[fg=#d79921,bg=#282828]"
set -g status-right "#[fg=#665c54,bg=#282828] %Y-%m-%d #[fg=#665c54,bg=#282828] #[fg=#ebdbb2,bg=#282828] %H:%M "
