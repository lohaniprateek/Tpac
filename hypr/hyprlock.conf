general {
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    color = rgba(255,255,255,1)
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(200,200,200,0.9)
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    rounding = 12

    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.3

    outer_color = rgba(255,255,255,0.6)
    inner_color = rgba(0,0,0,0.4)
    font_color = rgba(255,255,255,1)

    placeholder_text = Type password
    position = 0, -140
    halign = center
    valign = center
}
